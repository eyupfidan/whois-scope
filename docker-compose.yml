services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: whois-scope:latest
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: WhoisScope
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "true"
    volumes:
      - whois_scope_storage:/var/www/html/storage
      - whois_scope_database:/var/www/html/database

volumes:
  whois_scope_storage:
  whois_scope_database:
